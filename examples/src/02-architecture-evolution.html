<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  .shell{
    position:absolute; left:110px; top:66px; width:1520px; height:968px;
    border-radius:62px; background:#FFFFFF;
    box-shadow:0 22px 60px rgba(31,71,141,.085), 0 4px 14px rgba(31,71,141,.04);
  }
  .panel{
    position:absolute; left:140px; top:96px; width:1460px; height:908px;
    border-radius:50px;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;
  }
  .title{
    position:absolute; left:190px; top:148px;
    font-size:60px; font-weight:600; color:#191919; letter-spacing:.5px; line-height:1.25;
  }
  .content{
    position:absolute; left:180px; top:240px; width:1310px; height:620px;
    border-radius:34px; background:#FFFFFF;
    border:1px solid #F0F5FB;
    box-shadow:0 10px 30px rgba(31,71,141,.05);
  }

  /* 架构图区块 —— 未改动：退后 */
  .blk{
    position:absolute; border-radius:20px; background:#FFFFFF;
    border:1px solid #DCE8F6;
    box-shadow:0 3px 10px rgba(31,71,141,.035);
  }
  .blk .bar{
    position:absolute; height:10px; border-radius:5px; background:#D2E1F4;
  }
  .blk .node{
    position:absolute; width:38px; height:38px; border-radius:11px;
    background:#EDF5FE; display:flex; align-items:center; justify-content:center;
  }
  /* 目标区块 —— 唯一"活着"的一块 */
  .blk.target{
    border:2.5px solid #4A9DFC;
    box-shadow:0 0 0 10px rgba(74,157,252,.12), 0 16px 38px rgba(74,157,252,.20);
  }
  .blk.target .bar{background:#C9DCF3;}
  .tile{
    position:absolute; width:86px; height:86px; border-radius:23px;
    background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 12px 26px rgba(74,157,252,.42);
    display:flex; align-items:center; justify-content:center;
  }

  .badge{
    position:absolute; left:1320px; width:320px; height:104px;
    border-radius:22px; background:#FFFFFF;
    box-shadow:0 18px 44px rgba(31,71,141,.15), 0 3px 8px rgba(31,71,141,.05);
    display:flex; align-items:center; padding-left:30px;
  }
  .badge .txt{margin-left:14px; font-size:28px; font-weight:500; color:#191919; white-space:nowrap;}
</style>
</head>
<body>
<div class="canvas">

  <div class="shell"></div>
  <div class="panel"></div>
  <div class="title">架构局部迭代</div>
  <div class="content"></div>

  <!-- ================= 连线 ================= -->
  <svg width="1760" height="1120" viewBox="0 0 1760 1120"
       style="position:absolute;left:0;top:0;">
    <g stroke="#D8E6F9" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M590 396 V480"/>
      <path d="M1050 396 V480"/>
      <path d="M590 620 V662"/>
      <path d="M1050 620 V662"/>
      <path d="M590 662 H1050"/>
      <path d="M820 662 V700"/>
    </g>
    <!-- 四角手柄 -->
    <g fill="#FFFFFF" stroke="#4A9DFC" stroke-width="1.9">
      <rect x="374" y="473.5" width="10" height="10" rx="2.5"/>
      <rect x="796" y="473.5" width="10" height="10" rx="2.5"/>
      <rect x="374" y="616.5" width="10" height="10" rx="2.5"/>
      <rect x="796" y="616.5" width="10" height="10" rx="2.5"/>
    </g>
  </svg>

  <!-- ================= 第一层 2 块 ================= -->
  <div class="blk" style="left:380px; top:300px; width:420px; height:96px;">
    <div class="node" style="left:26px; top:29px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
        <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
      </svg>
    </div>
    <div class="bar" style="left:86px; top:33px; width:150px;"></div>
    <div class="bar" style="left:86px; top:57px; width:100px;"></div>
  </div>

  <div class="blk" style="left:840px; top:300px; width:420px; height:96px;">
    <div class="node" style="left:26px; top:29px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="6" rx="2"/>
        <rect x="3" y="14" width="18" height="6" rx="2"/>
        <path d="M7 7h.01M7 17h.01"/>
      </svg>
    </div>
    <div class="bar" style="left:86px; top:33px; width:170px;"></div>
    <div class="bar" style="left:86px; top:57px; width:126px;"></div>
  </div>

  <!-- ================= 第二层 2 块（首块为目标） ================= -->
  <div class="blk target" style="left:380px; top:480px; width:420px; height:140px;">
    <div class="tile" style="left:32px; top:27px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4L19.2 8.8a2.6 2.6 0 0 0-3.6-3.6L4 16.4z"/>
        <path d="M13.5 6.9 17.1 10.5"/>
      </svg>
    </div>
    <div class="bar" style="left:142px; top:44px; width:228px;"></div>
    <div class="bar" style="left:142px; top:66px; width:196px;"></div>
    <div class="bar" style="left:142px; top:88px; width:158px;"></div>
  </div>

  <div class="blk" style="left:840px; top:480px; width:420px; height:140px;">
    <div class="node" style="left:30px; top:51px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
        <path d="M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1"/>
      </svg>
    </div>
    <div class="bar" style="left:90px; top:44px; width:250px;"></div>
    <div class="bar" style="left:90px; top:66px; width:206px;"></div>
    <div class="bar" style="left:90px; top:88px; width:160px;"></div>
  </div>

  <!-- ================= 第三层 1 块 ================= -->
  <div class="blk" style="left:500px; top:700px; width:640px; height:90px;">
    <div class="node" style="left:26px; top:26px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="6" rx="8" ry="3"/>
        <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
        <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
      </svg>
    </div>
    <div class="bar" style="left:84px; top:40px; width:150px;"></div>
    <div class="bar" style="left:252px; top:40px; width:96px;"></div>
    <div class="bar" style="left:366px; top:40px; width:160px;"></div>
    <div class="bar" style="left:544px; top:40px; width:92px;"></div>
  </div>

  <!-- ================= 浮标 ================= -->
  <div class="badge" style="top:430px;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <div class="txt">仅更新此区域</div>
  </div>

  <div class="badge" style="top:566px;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="2"/>
      <rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/>
      <rect x="14" y="14" width="7" height="7" rx="2"/>
    </svg>
    <div class="txt">布局保持不变</div>
  </div>

</div>
</body>
</html>
