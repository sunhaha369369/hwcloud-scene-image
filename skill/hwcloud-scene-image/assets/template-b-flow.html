<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  /* L1 外壳白卡 */
  .shell{
    position:absolute; left:110px; top:66px; width:1520px; height:968px;
    border-radius:62px; background:#FFFFFF;
    box-shadow:0 22px 60px rgba(31,71,141,.085), 0 4px 14px rgba(31,71,141,.04);
  }
  /* L2 淡蓝面板 */
  .panel{
    position:absolute; left:140px; top:96px; width:1460px; height:908px;
    border-radius:50px;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;
  }
  /* 标题 */
  .title{
    position:absolute; left:190px; top:148px;
    font-size:60px; font-weight:600; color:#191919; letter-spacing:.5px; line-height:1.25;
  }
  /* L3 内容白卡 */
  .content{
    position:absolute; left:180px; top:240px; width:1310px; height:660px;
    border-radius:34px; background:#FFFFFF;
    border:1px solid #F0F5FB;
    box-shadow:0 10px 30px rgba(31,71,141,.05);
  }

  /* 输入卡 */
  .input{
    position:absolute; left:212px; top:300px; width:448px; height:104px;
    border-radius:52px; background:#FFFFFF;
    border:1px solid #E7F0FB;
    box-shadow:0 8px 22px rgba(31,71,141,.07);
    display:flex; align-items:center; padding-left:26px;
  }
  .input .ic{
    width:38px; height:38px; border-radius:11px; background:#EDF5FF;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .input .txt{
    margin-left:16px; font-size:28px; color:#191919; font-weight:400; letter-spacing:.2px;
    white-space:nowrap;
  }

  /* 主视觉渐变瓦片 */
  .hero{
    position:absolute; left:736px; top:300px; width:104px; height:104px;
    border-radius:26px;
    background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 16px 34px rgba(74,157,252,.38), 0 4px 10px rgba(124,107,245,.20);
    display:flex; align-items:center; justify-content:center;
  }

  /* 四张图表卡 */
  .chart{
    position:absolute; top:500px; width:250px; height:356px;
    border-radius:22px; background:#FFFFFF;
    border:1px solid #EEF4FB;
    box-shadow:0 6px 18px rgba(31,71,141,.05);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:4px 0 30px;
  }
  .chart .name{
    margin-top:14px; text-align:center;
    font-size:31px; font-weight:500; color:#191919; letter-spacing:.5px;
  }

  /* L4 浮标 */
  .badge{
    position:absolute; left:1336px; top:560px; width:320px; height:104px;
    border-radius:22px; background:#FFFFFF;
    box-shadow:0 18px 44px rgba(31,71,141,.15), 0 3px 8px rgba(31,71,141,.05);
    display:flex; align-items:center; padding-left:30px;
  }
  .badge .txt{margin-left:14px; font-size:28px; font-weight:500; color:#191919; white-space:nowrap;}

  svg{display:block;}
</style>
</head>
<body>
<div class="canvas">

  <div class="shell"></div>
  <div class="panel"></div>
  <div class="title">文档配图生成</div>
  <div class="content"></div>

  <!-- 输入 -->
  <div class="input">
    <div class="ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h10"/><path d="M4 12h7"/><path d="M4 17h5"/>
        <path d="M17 10v8"/><path d="M13.8 15.2 17 18.4l3.2-3.2"/>
      </svg>
    </div>
    <div class="txt">画一张订单支付的时序图</div>
  </div>

  <!-- 主视觉 -->
  <div class="hero">
    <svg width="55" height="55" viewBox="0 0 56 56" fill="none" stroke="#FFFFFF"
         stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 10.5h18.5L41 20v25.5a3.5 3.5 0 0 1-3.5 3.5H16.5A3.5 3.5 0 0 1 13 45.5z"/>
      <path d="M31 10.5v10h10"/>
      <path d="M20 41v-8"/><path d="M26.5 41v-14"/><path d="M33 41v-5"/>
      <path d="M45.5 8.5l1.2 3.1 3.1 1.2-3.1 1.2-1.2 3.1-1.2-3.1L41.2 12.8l3.1-1.2z"
            fill="#FFFFFF" stroke="none"/>
    </svg>
  </div>

  <!-- 连接线 -->
  <svg width="1760" height="1120" viewBox="0 0 1760 1120"
       style="position:absolute;left:0;top:0;pointer-events:none;">
    <!-- 输入 → 主视觉 -->
    <line x1="664" y1="352" x2="714" y2="352"
          stroke="#7FB3FF" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
    <path d="M726 352 l-11 -5.5 v11 z" fill="#7FB3FF"/>

    <!-- 主视觉 ↓ -->
    <line x1="788" y1="406" x2="788" y2="452"
          stroke="#BDD7F5" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
    <!-- 总线 -->
    <line x1="335" y1="452" x2="1157" y2="452"
          stroke="#BDD7F5" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
    <!-- 分叉节点 -->
    <circle cx="788" cy="452" r="6" fill="#9CC0FC"/>

    <!-- 下落分支 -->
    <g stroke="#BDD7F5" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round">
      <line x1="335" y1="452" x2="335" y2="482"/>
      <line x1="609" y1="452" x2="609" y2="482"/>
      <line x1="883" y1="452" x2="883" y2="482"/>
      <line x1="1157" y1="452" x2="1157" y2="482"/>
    </g>
    <g fill="#9CC0FC">
      <path d="M335 495 l-6.5 -13 h13 z"/>
      <path d="M609 495 l-6.5 -13 h13 z"/>
      <path d="M883 495 l-6.5 -13 h13 z"/>
      <path d="M1157 495 l-6.5 -13 h13 z"/>
    </g>
  </svg>

  <!-- ========== 卡 1 时序图 ========== -->
  <div class="chart" style="left:210px;">
    <svg width="250" height="268" viewBox="0 0 250 268" fill="none">
      <g stroke="#BDD7F5" stroke-width="1.5" stroke-dasharray="4 7" stroke-linecap="round">
        <line x1="42" y1="46" x2="42" y2="206"/>
        <line x1="100" y1="46" x2="100" y2="206"/>
        <line x1="158" y1="46" x2="158" y2="206"/>
        <line x1="216" y1="46" x2="216" y2="206"/>
      </g>
      <g fill="#EDF5FF" stroke="#BDD7F5" stroke-width="1.6">
        <rect x="20" y="20" width="44" height="26" rx="8"/>
        <rect x="78" y="20" width="44" height="26" rx="8"/>
        <rect x="136" y="20" width="44" height="26" rx="8"/>
        <rect x="194" y="20" width="44" height="26" rx="8"/>
      </g>
      <!-- 激活条 -->
      <g fill="#B7D2F1">
        <rect x="97" y="76" width="6" height="78" rx="3"/>
        <rect x="155" y="138" width="6" height="54" rx="3"/>
      </g>
      <!-- 消息 -->
      <g stroke="#9FC1E8" stroke-width="2.2" stroke-linecap="round">
        <line x1="104" y1="82" x2="206" y2="82"/>
        <line x1="212" y1="112" x2="106" y2="112"/>
        <line x1="104" y1="146" x2="52" y2="146"/>
      </g>
      <g fill="#9FC1E8">
        <path d="M216 82 l-10 -5 v10 z"/>
        <path d="M100 112 l10 -5 v10 z"/>
        <path d="M42 146 l10 -5 v10 z"/>
      </g>
      <!-- 高亮一条消息 -->
      <line x1="161" y1="180" x2="207" y2="180" stroke="#4A9DFC" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M217 180 l-11 -5.5 v11 z" fill="#4A9DFC"/>
    </svg>
    <div class="name">时序图</div>
  </div>

  <!-- ========== 卡 2 ER 图 ========== -->
  <div class="chart" style="left:484px;">
    <svg width="250" height="268" viewBox="0 0 250 268" fill="none">
      <!-- 实体 A -->
      <rect x="22" y="34" width="88" height="62" rx="9" fill="#FFFFFF" stroke="#BDD7F5" stroke-width="1.8"/>
      <rect x="22" y="34" width="88" height="24" rx="9" fill="#EDF5FF"/>
      <rect x="22" y="48" width="88" height="10" fill="#EDF5FF"/>
      <rect x="22" y="34" width="88" height="24" rx="9" fill="none" stroke="#BDD7F5" stroke-width="1.8"/>
      <line x1="22" y1="58" x2="110" y2="58" stroke="#BDD7F5" stroke-width="1.6"/>
      <rect x="32" y="42" width="42" height="6" rx="3" fill="#9FC1E8"/>
      <rect x="32" y="68" width="56" height="5" rx="2.5" fill="#BDD7F5"/>
      <rect x="32" y="80" width="38" height="5" rx="2.5" fill="#BDD7F5"/>
      <!-- 实体 B -->
      <rect x="140" y="150" width="88" height="62" rx="9" fill="#FFFFFF" stroke="#BDD7F5" stroke-width="1.8"/>
      <rect x="140" y="150" width="88" height="24" rx="9" fill="#EDF5FF"/>
      <rect x="140" y="164" width="88" height="10" fill="#EDF5FF"/>
      <rect x="140" y="150" width="88" height="24" rx="9" fill="none" stroke="#BDD7F5" stroke-width="1.8"/>
      <line x1="140" y1="174" x2="228" y2="174" stroke="#BDD7F5" stroke-width="1.6"/>
      <rect x="150" y="158" width="42" height="6" rx="3" fill="#9FC1E8"/>
      <rect x="150" y="184" width="52" height="5" rx="2.5" fill="#BDD7F5"/>
      <rect x="150" y="196" width="34" height="5" rx="2.5" fill="#BDD7F5"/>
      <!-- 连线 -->
      <path d="M110 65 H125 V181 H140" stroke="#9FC1E8" stroke-width="2.2"
            stroke-linecap="round" fill="none"/>
      <!-- 关系菱形 -->
      <path d="M125 116 L143 135 L125 154 L107 135 Z"
            fill="#FFFFFF" stroke="#4A9DFC" stroke-width="2.4"/>
    </svg>
    <div class="name">ER 图</div>
  </div>

  <!-- ========== 卡 3 状态机 ========== -->
  <div class="chart" style="left:758px;">
    <svg width="250" height="268" viewBox="0 0 250 268" fill="none">
      <!-- 起始 -->
      <circle cx="24" cy="112" r="6.5" fill="#9FC1E8"/>
      <line x1="31" y1="112" x2="48" y2="112" stroke="#9FC1E8" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M60 112 l-10 -5 v10 z" fill="#9FC1E8"/>
      <!-- 状态 -->
      <circle cx="86" cy="112" r="26" fill="#EDF5FF" stroke="#BDD7F5" stroke-width="1.9"/>
      <circle cx="86" cy="112" r="4.5" fill="#9FC1E8"/>
      <circle cx="154" cy="112" r="26" fill="#FFFFFF" stroke="#BDD7F5" stroke-width="1.9"/>
      <circle cx="154" cy="112" r="4.5" fill="#9FC1E8"/>
      <circle cx="222" cy="112" r="24" fill="#FFFFFF" stroke="#BDD7F5" stroke-width="1.9"/>
      <circle cx="222" cy="112" r="4.5" fill="#9FC1E8"/>
      <!-- A→B（高亮） -->
      <line x1="111" y1="112" x2="119" y2="112" stroke="#4A9DFC" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M129 112 l-11 -5.5 v11 z" fill="#4A9DFC"/>
      <!-- B→C -->
      <line x1="179" y1="112" x2="187" y2="112" stroke="#9FC1E8" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M197 112 l-11 -5.5 v11 z" fill="#9FC1E8"/>
      <!-- 回环 -->
      <path d="M222 136 V168 Q222 180 208 180 H100 Q86 180 86 168 V138"
            stroke="#BDD7F5" stroke-width="2.2" stroke-dasharray="7 6"
            stroke-linecap="round" fill="none"/>
      <path d="M86 126 l-5.5 12 h11 z" fill="#BDD7F5"/>
    </svg>
    <div class="name">状态机</div>
  </div>

  <!-- ========== 卡 4 部署拓扑 ========== -->
  <div class="chart" style="left:1032px;">
    <svg width="250" height="268" viewBox="0 0 250 268" fill="none">
      <!-- 主干 -->
      <g stroke="#BDD7F5" stroke-width="2.2" stroke-linecap="round" fill="none">
        <line x1="125" y1="56" x2="125" y2="98"/>
        <path d="M48 98 H202"/>
        <line x1="48" y1="98" x2="48" y2="116"/>
        <line x1="125" y1="98" x2="125" y2="116"/>
        <line x1="202" y1="98" x2="202" y2="116"/>
      </g>
      <!-- 顶层 -->
      <rect x="96" y="22" width="58" height="34" rx="9" fill="#EDF5FF" stroke="#BDD7F5" stroke-width="1.8"/>
      <rect x="110" y="36" width="30" height="6" rx="3" fill="#9FC1E8"/>
      <!-- 中层 -->
      <rect x="24" y="116" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#BDD7F5" stroke-width="1.8"/>
      <rect x="101" y="116" width="48" height="36" rx="8" fill="#EDF5FF" stroke="#4A9DFC" stroke-width="2"/>
      <rect x="178" y="116" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#BDD7F5" stroke-width="1.8"/>
      <!-- 中层→底层 -->
      <g stroke="#BDD7F5" stroke-width="1.8" stroke-linecap="round">
        <line x1="48" y1="152" x2="48" y2="172"/>
        <line x1="125" y1="152" x2="125" y2="172"/>
        <line x1="202" y1="152" x2="202" y2="172"/>
      </g>
      <g fill="#EDF5FF" stroke="#BDD7F5" stroke-width="1.6">
        <rect x="36" y="172" width="24" height="16" rx="5"/>
        <rect x="113" y="172" width="24" height="16" rx="5"/>
        <rect x="190" y="172" width="24" height="16" rx="5"/>
      </g>
    </svg>
    <div class="name">部署拓扑图</div>
  </div>

  <!-- 浮标 -->
  <div class="badge">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/>
      <path d="M13 3v6h6"/>
      <path d="M12 12.5v5"/><path d="M9.5 15h5"/>
    </svg>
    <div class="txt">一键插入文档</div>
  </div>

</div>
</body>
</html>
