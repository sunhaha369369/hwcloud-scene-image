<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  .shell{
    position:absolute; left:110px; top:66px; width:1520px; height:968px;
    border-radius:62px; background:#FFFFFF;
    box-shadow:0 22px 60px rgba(31,71,141,.085), 0 4px 14px rgba(31,71,141,.04);
  }
  .panel{
    position:absolute; left:140px; top:96px; width:1460px; height:908px;
    border-radius:50px;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;
  }
  .title{
    position:absolute; left:190px; top:148px;
    font-size:60px; font-weight:600; color:#191919; letter-spacing:.5px; line-height:1.25;
  }
  .content{
    position:absolute; left:180px; top:240px; width:1310px; height:644px;
    border-radius:36px; background:#FFFFFF;
    border:1px solid #F0F5FB;
    box-shadow:0 10px 30px rgba(31,71,141,.05);
  }

  /* ---- 渐变图标瓦片 ---- */
  .tile{
    position:absolute; left:224px; top:272px; width:132px; height:132px;
    border-radius:34px;
    background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 16px 34px rgba(74,157,252,.40), 0 0 34px 6px rgba(124,107,245,.16);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- 输入条 ---- */
  .prompt{
    position:absolute; left:372px; top:290px; width:972px; height:92px;
    border-radius:26px; background:#FFFFFF;
    border:1px solid #E3EDF9;
    box-shadow:0 8px 22px rgba(31,71,141,.055);
    display:flex; align-items:center;
  }
  .prompt .ico{margin-left:28px; display:flex;}
  .prompt .txt{
    margin-left:18px; font-size:24px; color:#191919; letter-spacing:.2px;
    white-space:nowrap;
  }
  .prompt .send{
    position:absolute; right:18px; top:18px; width:56px; height:56px; border-radius:50%;
    background:#4A9DFC; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(74,157,252,.38);
  }

  /* ---- 画布卡 ---- */
  .board{
    position:absolute; left:224px; top:426px; width:1120px; height:414px;
    border-radius:32px; background:#F8FBFF;
    border:1px solid #DDEBFB;
    box-shadow:0 8px 24px rgba(31,71,141,.05);
  }
  .tab{
    position:absolute; top:18px; height:34px; line-height:34px;
    font-size:22px; color:#8A95A3; letter-spacing:.4px;
  }
  .tab.on{color:#191919; font-weight:500;}
  .underline{
    position:absolute; left:34px; top:57px; width:68px; height:3px;
    border-radius:2px; background:#4A9DFC;
  }
  .divider{
    position:absolute; left:34px; top:60px; width:1052px; height:1px; background:#E7F0FA;
  }

  .lay{
    position:absolute; left:52px; height:26px; line-height:26px;
    font-size:20px; color:#71808F; letter-spacing:.5px;
  }

  .node{
    position:absolute; width:268px; height:88px; border-radius:20px;
    background:#FFFFFF; border:1px solid #C6D9F1;
    box-shadow:0 3px 10px rgba(31,71,141,.04);
  }
  .node .nb{
    position:absolute; width:40px; height:40px; border-radius:12px;
    left:20px; top:24px; background:#E5F1FE;
    display:flex; align-items:center; justify-content:center;
  }
  .node .bar{
    position:absolute; height:12px; border-radius:6px; background:#BCD3EF;
  }
  .node.sel{
    background:#F6FAFF;
    border:2.5px solid #4A9DFC;
    box-shadow:0 0 0 10px rgba(74,157,252,.10), 0 16px 34px rgba(74,157,252,.18);
  }
  .node.sel .bar{background:#A9C7EC;}

  .bubble{
    position:absolute; left:794px; top:182px; width:300px; height:88px;
    border-radius:20px; background:#FFFFFF;
    border:1px solid #C6D9F1;
    box-shadow:0 12px 30px rgba(31,71,141,.11), 0 2px 6px rgba(31,71,141,.04);
    display:flex; align-items:center; padding-left:22px;
  }
  .bubble .txt{margin-left:10px; font-size:21px; color:#191919; white-space:nowrap;}

  .zoom{
    position:absolute; left:918px; top:352px; width:168px; height:42px;
    border-radius:14px; background:#FFFFFF; border:1px solid #DDEBFB;
    box-shadow:0 4px 12px rgba(31,71,141,.045);
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  }
  .zoom .z{font-size:20px; color:#A5B0BF; line-height:1;}
  .zoom .val{font-size:17px; color:#8C97A6; letter-spacing:.3px;}

  .badge{
    position:absolute; left:1356px; width:284px; height:94px;
    border-radius:24px; background:#FFFFFF;
    box-shadow:0 18px 44px rgba(31,71,141,.15), 0 3px 8px rgba(31,71,141,.05);
    display:flex; align-items:center; padding-left:26px;
  }
  .badge .txt{margin-left:12px; font-size:26px; font-weight:500; color:#191919; white-space:nowrap;}
</style>
</head>
<body>
<div class="canvas">

  <div class="shell"></div>
  <div class="panel"></div>
  <div class="title">智能图表绘制</div>
  <div class="content"></div>

  <!-- ================= 渐变图标 ================= -->
  <div class="tile">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="5.6" r="2.5"/>
      <circle cx="18" cy="5.6" r="2.5"/>
      <circle cx="12" cy="18.4" r="2.5"/>
      <path d="M8.5 5.6h7"/>
      <path d="M7.4 7.9l3.4 8"/>
      <path d="M16.6 7.9l-3.4 8"/>
    </svg>
  </div>

  <!-- ================= 输入条 ================= -->
  <div class="prompt">
    <div class="ico">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E9EB3"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h6"/>
      </svg>
    </div>
    <div class="txt">画一张订单支付的架构图，包含网关、服务与数据库</div>
    <div class="send">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF"
           stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/>
      </svg>
    </div>
  </div>

  <!-- ================= 画布 ================= -->
  <div class="board">
    <div class="tab on" style="left:34px;">架构图</div>
    <div class="tab" style="left:127px;">流程图</div>
    <div class="tab" style="left:220px;">结构图</div>
    <div class="underline"></div>
    <div class="divider"></div>

    <div class="lay" style="top:95px;">接入层</div>
    <div class="lay" style="top:213px;">服务层</div>
    <div class="lay" style="top:331px;">数据层</div>

    <!-- 连线 -->
    <svg width="1120" height="414" viewBox="0 0 1120 414"
         style="position:absolute;left:0;top:0;">
      <g stroke="#BFD6F1" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M272 152 V171"/>
        <path d="M272 270 V289"/>
        <path d="M608 152 V171"/>
        <path d="M608 270 V289"/>
        <path d="M406 226 H456"/>
      </g>
      <g fill="#BFD6F1">
        <path d="M265 170 h14 l-7 12 z"/>
        <path d="M265 288 h14 l-7 12 z"/>
        <path d="M601 170 h14 l-7 12 z"/>
        <path d="M601 288 h14 l-7 12 z"/>
        <path d="M456 219 l12 7 l-12 7 z"/>
      </g>
    </svg>

    <!-- 接入层 -->
    <div class="node" style="left:138px; top:64px;">
      <div class="nb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/>
          <path d="M12 3.5a13 13 0 0 1 0 17a13 13 0 0 1 0-17"/>
        </svg>
      </div>
      <div class="bar" style="left:72px; top:28px; width:152px;"></div>
      <div class="bar" style="left:72px; top:50px; width:102px;"></div>
    </div>

    <div class="node" style="left:474px; top:64px;">
      <div class="nb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="6" rx="2"/>
          <rect x="3" y="14" width="18" height="6" rx="2"/>
        </svg>
      </div>
      <div class="bar" style="left:72px; top:28px; width:162px;"></div>
      <div class="bar" style="left:72px; top:50px; width:110px;"></div>
    </div>

    <!-- 服务层（右块选中） -->
    <div class="node" style="left:138px; top:182px;">
      <div class="nb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="2"/>
          <rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/>
          <rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
      </div>
      <div class="bar" style="left:72px; top:28px; width:154px;"></div>
      <div class="bar" style="left:72px; top:50px; width:104px;"></div>
    </div>

    <div class="node sel" style="left:474px; top:182px;">
      <div class="nb" style="background:#D8E9FF;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 2.5 5 13.5h5.5l-1 8 8.5-11h-5.5z"/>
        </svg>
      </div>
      <div class="bar" style="left:72px; top:28px; width:166px;"></div>
      <div class="bar" style="left:72px; top:50px; width:114px;"></div>
    </div>

    <!-- 数据层 -->
    <div class="node" style="left:138px; top:300px;">
      <div class="nb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="6" rx="8" ry="3"/>
          <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
          <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
        </svg>
      </div>
      <div class="bar" style="left:72px; top:28px; width:130px;"></div>
      <div class="bar" style="left:72px; top:50px; width:88px;"></div>
    </div>

    <div class="node" style="left:474px; top:300px;">
      <div class="nb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E9CD0"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="4" width="17" height="16" rx="3"/>
          <path d="M3.5 9h17"/><path d="M8 14h5"/>
        </svg>
      </div>
      <div class="bar" style="left:72px; top:28px; width:144px;"></div>
      <div class="bar" style="left:72px; top:50px; width:96px;"></div>
    </div>

    <!-- 选中手柄 + 锚点 -->
    <svg width="1120" height="414" viewBox="0 0 1120 414"
         style="position:absolute;left:0;top:0;">
      <g stroke="#A9C9F2" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round">
        <path d="M752 226 H790"/>
      </g>
      <circle cx="747" cy="226" r="3" fill="#4A9DFC"/>
      <g fill="#FFFFFF" stroke="#4A9DFC" stroke-width="1.9">
        <rect x="469" y="177" width="10" height="10" rx="2.4"/>
        <rect x="737" y="177" width="10" height="10" rx="2.4"/>
        <rect x="469" y="265" width="10" height="10" rx="2.4"/>
        <rect x="737" y="265" width="10" height="10" rx="2.4"/>
      </g>
    </svg>

    <!-- 指令气泡 -->
    <div class="bubble">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4L19.2 8.8a2.6 2.6 0 0 0-3.6-3.6L4 16.4z"/>
        <path d="M13.5 6.9 17.1 10.5"/>
      </svg>
      <div class="txt">把这一块改成异步调用</div>
    </div>

    <!-- 缩放控件 -->
    <div class="zoom">
      <div class="z">−</div>
      <div class="val">100%</div>
      <div class="z">+</div>
    </div>
  </div>

  <!-- ================= 浮标 ================= -->
  <div class="badge" style="top:526px;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 3l1.9 4.6L17.5 9.5l-4.6 1.9L11 16l-1.9-4.6L4.5 9.5l4.6-1.9z"/>
      <path d="M18 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
    </svg>
    <div class="txt">一句话生成</div>
  </div>

  <div class="badge" style="top:646px;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3H3v2"/><path d="M21 5V3h-2"/>
      <path d="M3 19v2h2"/><path d="M19 21h2v-2"/>
      <path d="M9 9h6v6H9z"/>
    </svg>
    <div class="txt">精准局部修改</div>
  </div>

</div>
</body>
</html>
